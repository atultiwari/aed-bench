<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pose reference</title>
<style>body{margin:0;background:#fff}svg{display:block}</style>
</head>
<body>
<!-- Renders one sprite's pose reference from the shared, posture-tested skeleton, at the scene camera (Sketchbook VIEW 0),
     inside a fixed 3D frame per sprite, so every generated sprite can be placed back exactly.
     tools/pose-ref.html?sprite=P1           the reference, as a picture for the image model
     window.SPRITE_META                      the frame: viewBox origin and size in scene units (read by the scene later) -->
<div id="out"></div>
<script src="../sketchbook/engine.js"></script>
<script src="../shared/aed-spec.js"></script>
<script src="../shared/aed-people.js"></script>
<script src="../sketchbook/aed-people-draw.js"></script>
<script>
const PP = AEDPeople;
const LM = PP.landmarks(PP.solve(PP.POSES.patient()));
const LMT = PP.landmarks(PP.solve(PP.POSES.patient({ tilt: 1 })));   // head tilted back
setLight(105);
// 3D frames (cm, scene coordinates): every sprite of a person uses the same frame, so their sprites share one scale
const FRAMES = {
  patient: { x: [58, 142], y: [6, 204], z: [0, 34] },
  A: { x: [8, 128], y: [104, 200], z: [0, 128] },
  // patient and rescuer together: for every pose where the rescuer touches him
  PA: { x: [8, 142], y: [6, 204], z: [0, 128] },
};
const SPRITES = {
  P1: { frame: 'patient', people: [['patient', {}]], opt: { shirtOpen: 0 } },
  P2: { frame: 'patient', people: [['patient', { tilt: 1 }]], opt: { shirtOpen: 0 } },
  P3: { frame: 'patient', people: [['patient', {}]], opt: { shirtOpen: 1 } },
  // Rescuer A kneels on the far side, level with the lower sternum (knees at x 60, y 150)
  A1: { frame: 'A', people: [['A_kneel', { at: [60, 150], look: { yaw: 0, pitch: 28 } }]], opt: {} },
  // ERC 2025 Fig. 7 "Response": shake the shoulders gently, ask loudly. Hands on both of his shoulders.
  A2: { frame: 'A', people: [['raw', { who: 'A', mode: 'kneel', at: [70, 162], facing: [1, 0, 0], look: { pitch: 30 },
    hands: { L: { to: LM.shoulderR, shape: 'flat' }, R: { to: LM.shoulderL, shape: 'flat' } } }]], opt: {}, ghost: 'patient' },
  // A2 drawn together with the patient; A's layer is cut out with ?mask=1
  A2c: { frame: 'fit', layer: 1, people: [['patient', {}], ['raw', { who: 'A', mode: 'kneel', at: [70, 162], facing: [1, 0, 0], look: { pitch: 30 },
    hands: { L: { to: LM.shoulderR, shape: 'flat' }, R: { to: LM.shoulderL, shape: 'flat' } } }]], opt: {} },
  // ERC 2025 Fig. 7 "Airway" and "Breathing": hand on the forehead, fingertips under the point of the chin, head tilted back
  A3c: { frame: 'fit', layer: 1, people: [['patient', { tilt: 1 }], ['raw', { who: 'A', mode: 'kneel', at: [66, 172], facing: [1, 0, 0], look: { pitch: 40 },
    hands: { L: { to: LMT.forehead, shape: 'flat', dir: [0, 1, 0] }, R: { to: LMT.chin, shape: 'flat', dir: [0, 1, 0] } } }]], opt: {} },
  // "Get the AED!": kneeling up, turned to her right, pointing at the helper standing toward the patient's feet
  A4c: { frame: 'fit', layer: 1, people: [['patient', {}], ['raw', { who: 'A', mode: 'kneel', at: [60, 150], facing: [1, 0, 0], look: { yaw: 55, pitch: -5 },
    hands: { R: { to: [96, 97, 96], shape: 'point', dir: [.62, -.74, .1] } } }]], opt: {} },
  // ERC 2025 "Using an AED": nobody touches the person while it analyses. Shirt open (pads on, drawn by code).
  A8c: { frame: 'fit', layer: 1, people: [['patient', {}], ['A_handsOff', { at: [60, 142] }]], opt: { shirtOpen: 1 } },
  // Helper B, standing where Rescuer A points in A4 (her pointing line reaches about (158, 23) at 150 cm), facing her
  B1: { frame: 'fit', people: [['B_stand', { at: [158, 20], facing: [-98, 130, 0], look: { pitch: 8 } }]], opt: {} },
  // Helper B running off to fetch the AED: away from the patient, toward the upper right (-y), two frames of the cycle
  B2: { frame: 'fit', people: [['B_run', { at: [158, -10], facing: [0, -1, 0], phase: Math.PI / 2 }]], opt: {} },
  B3: { frame: 'fit', people: [['B_run', { at: [158, -10], facing: [0, -1, 0], phase: -Math.PI / 2 }]], opt: {} },
  // Helper B walking back in with the AED (from beyond the patient's head, far side), carrying it by the handle
  B4: { frame: 'fit', people: [['raw', { who: 'B', mode: 'run', at: [10, 290], facing: [.19, -.98, 0], phase: .9, look: { pitch: 6 },
    hands: { R: { to: [-10, 285, 64], shape: 'grip' } } }]], opt: {},
    props: () => box(-16, 269, 30, -4, 301, 60, matOf('#2f9e5b'), toneI, 1.1) + box(-12, 279, 60, -8, 291, 64, matOf('#3d3935'), toneI, .9) },
  // Helper B kneeling beyond the patient's head at the open AED (case at x 36-80, y 222-266 as in the Sketchbook),
  // pressing the SHOCK button with his right hand
  B5: { frame: 'fit', people: [['B_reach', { at: [16, 248], to: [67, 254, 13.5] }]], opt: {},
    props: () => box(36, 222, 0, 80, 266, 12, matOf('#2f9e5b'), toneI, 1.1)
      + shape(on(PZ(12.05), rrUV(39, 225, 77, 263, 3)), '#55504a', .8) + shape(on(PZ(12.1), rrUV(40, 229, 57, 262, 2)), '#203a2c', .7)
      + cyl(68, 231, 12, 13.4, 3.6, matOf('#5fe08a'), toneI, .9) + cyl(67, 254, 12, 13.4, 4.4, matOf('#f08c00'), toneI, .9)
      + box(36, 268, 0, 80, 312, 4, matOf('#2f9e5b'), toneI, 1.1),
    propBox: [[36, 222, 0], [80, 312, 14]] },
  // Pad 1 goes on while compressions continue (ERC 2025: "continue CPR while the defibrillation pads are being attached"):
  // Helper B, kneeling beyond the head on the patient's right, presses pad 1 below the right collarbone
  B6c: { frame: 'fit', people: [['patient', {}], ['A_compress', {}],
    ['raw', { who: 'B', mode: 'kneel', at: [64, 220], facing: [28, -64, 0], sit: .1, look: { pitch: 35 }, hands: { R: { to: LM.padRight, shape: 'flat', dir: [1, 0, 0] } } }]],
    opt: { shirtOpen: 1 }, props: () => shape(on(PZ(LM.padRight[2] + .6), rrUV(LM.padRight[0] - 6, LM.padRight[1] - 8, LM.padRight[0] + 6, LM.padRight[1] + 8, 2)), '#f7f5ee', 1.2) },
  // Pad 2 while compressions continue: Helper B moves round to the patient's left side, beside his chest, and presses
  // pad 2 on the left mid-axillary line below the armpit. Pad 1 is already on.
  B7c: { frame: 'fit', people: [['patient', {}], ['A_compress', {}],
    ['raw', { who: 'B', mode: 'kneel', at: [164, 146], facing: [-1, 0, 0], chest: [138, 140, 64], look: { pitch: 45 },
      hands: { R: { to: [LM.padLeft[0] + 3, LM.padLeft[1], LM.padLeft[2] + 4], shape: 'flat', dir: [-1, 0, 0] } } }]],
    opt: { shirtOpen: 1 }, props: () => shape(on(PZ(LM.padRight[2] + .6), rrUV(LM.padRight[0] - 6, LM.padRight[1] - 8, LM.padRight[0] + 6, LM.padRight[1] + 8, 2)), '#f7f5ee', 1.2)
      + shape(on(PX(LM.padLeft[0] + .5), rrUV(LM.padLeft[1] - 8, LM.padLeft[2] - 6, LM.padLeft[1] + 8, LM.padLeft[2] + 6, 2)), '#f7f5ee', 1.2) },
  // "Everyone clear!" (ERC 2025 Fig. 7: follow the AED; make sure nobody touches the person): Helper B kneels upright
  // at the AED, his left arm sweeping out over the patient, looking along the body; his right hand waits by the button
  B8: { frame: 'fit', people: [['raw', { who: 'B', mode: 'kneel', at: [16, 248], facing: [1, -.35, 0], chest: [24, 246, 88], look: { pitch: 8, yaw: -25 },
    hands: { L: { to: [58, 205, 92], shape: 'open' } } }]], opt: {},
    props: () => box(36, 222, 0, 80, 266, 12, matOf('#2f9e5b'), toneI, 1.1)
      + shape(on(PZ(12.05), rrUV(39, 225, 77, 263, 3)), '#55504a', .8) + shape(on(PZ(12.1), rrUV(40, 229, 57, 262, 2)), '#203a2c', .7)
      + cyl(68, 231, 12, 13.4, 3.6, matOf('#5fe08a'), toneI, .9) + cyl(67, 254, 12, 13.4, 4.4, matOf('#ffd36a'), toneI, .9)
      + box(36, 268, 0, 80, 312, 4, matOf('#2f9e5b'), toneI, 1.1),
    propBox: [[36, 222, 0], [80, 312, 14]] },
  // Station 17: straight back to compressions after the shock: bare chest, both pads still on (Helper B is a separate sprite)
  C17c: { frame: 'fit', people: [['patient', {}], ['A_compress', {}]], opt: { shirtOpen: 1 },
    props: () => shape(on(PZ(LM.padRight[2] + .6), rrUV(LM.padRight[0] - 6, LM.padRight[1] - 8, LM.padRight[0] + 6, LM.padRight[1] + 8, 2)), '#f7f5ee', 1.2)
      + shape(on(PX(LM.padLeft[0] + .5), rrUV(LM.padLeft[1] - 8, LM.padLeft[2] - 6, LM.padLeft[1] + 8, LM.padLeft[2] + 6, 2)), '#f7f5ee', 1.2) },
};
const id = new URLSearchParams(location.search).get('sprite') || 'P1', SP = SPRITES[id], F = FRAMES[SP.frame] || null;
const Q0 = new URLSearchParams(location.search);
const solved = SP.people.map(([pose, o]) => PP.solve(pose === 'raw' ? o : PP.POSES[pose](o)));
// a fixed frame per person, or (frame 'fit') one fitted to these figures' joints plus a margin for hair, hands and feet
const corners = [];
if (SP.frame === 'fit') solved.forEach(p => Object.values(p.J).forEach(j => { for (const dx of [-20, 20]) for (const dy of [-20, 20]) for (const dz of [-4, 18]) corners.push([j[0] + dx, j[1] + dy, Math.max(0, j[2] + dz)]); }));
else for (const x of F.x) for (const y of F.y) for (const z of F.z) corners.push([x, y, z]);
if (SP.propBox) { const [a, b] = SP.propBox; for (const x of [a[0], b[0]]) for (const y of [a[1], b[1]]) for (const z of [a[2], b[2]]) corners.push([x, y, z]); }
RC = [0, 0]; OX = OY = 0;   // VIEW 0: RC has no effect; the scene uses the same projection
const q = corners.map(c => P(...c)), xs = q.map(v => v[0]), ys = q.map(v => v[1]);
// pad the frame to exactly 3:2 (the image model's aspect), centred, so a generated image maps back by scale alone
let x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
if (w / h < 1.5) { const W2 = h * 1.5; x0 -= (W2 - w) / 2; w = W2; } else { const H2 = w / 1.5; y0 -= (H2 - h) / 2; h = H2; }
OX = -x0; OY = -y0;
const Q = new URLSearchParams(location.search), MASK = Q.get('mask') === '1';
const people = solved.map(p => pplPerson(p, SP.opt));
// ?mask=1: what the viewer sees of the layer person, black, with everyone else in white drawn in true depth order,
// so parts of her hidden behind him stay out of her layer (tools/extract_layer.py grows it a little)
const parts = MASK ? people.flatMap((ps, i) => ps.map(q => ({ ...q, svg: `<g filter="url(#${i === SP.layer ? 'blk' : 'wht'})">${q.svg}</g>` }))) : people.flat();
const PX_PER_UNIT = 1536 / w;
// ghost: the person this pose touches, drawn as a pale grey placeholder behind, so the model understands the pose
const ghost = SP.ghost && new URLSearchParams(location.search).get('ghost') !== '0' ? `<filter id="grey"><feColorMatrix type="saturate" values="0"/></filter><g opacity=".28" filter="url(#grey)">${byDepth(pplPerson(PP.solve(PP.POSES.patient()), {}))}</g>` : '';
const solid = (fid, col) => `<filter id="${fid}"><feFlood flood-color="${col}"/><feComposite in2="SourceAlpha" operator="in"/></filter>`;
const props = SP.props ? SP.props() : '';
const body = MASK ? `${solid('blk', '#000')}${solid('wht', '#fff')}${byDepth(parts)}` : `${ghost}${byDepth(parts)}${props}`;
document.getElementById('out').innerHTML = `<svg width="${(w * PX_PER_UNIT / 2).toFixed(0)}" height="${(h * PX_PER_UNIT / 2).toFixed(0)}" viewBox="0 0 ${w.toFixed(2)} ${h.toFixed(2)}">${body}</svg>`;
// where this frame sits in the scene projection (P with OX = OY = 0, RC as above): add these to place the sprite
window.SPRITE_META = { sprite: id, frame: SP.frame, originX: x0, originY: y0, width: w, height: h };
document.title = JSON.stringify(window.SPRITE_META);
</script>
</body>
</html>
