<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pose reference</title>
<style>body{margin:0;background:#fff}svg{display:block}</style>
</head>
<body>
<!-- Renders one sprite's pose reference from the shared, posture-tested skeleton, at the scene camera (Sketchbook VIEW 0),
     inside a fixed 3D frame per sprite, so every generated sprite can be placed back exactly.
     tools/pose-ref.html?sprite=P1           the reference, as a picture for the image model
     window.SPRITE_META                      the frame: viewBox origin and size in scene units (read by the scene later) -->
<div id="out"></div>
<script src="../sketchbook/engine.js"></script>
<script src="../shared/aed-spec.js"></script>
<script src="../shared/aed-people.js"></script>
<script src="../sketchbook/aed-people-draw.js"></script>
<script>
const PP = AEDPeople;
setLight(105);
// 3D frames (cm, scene coordinates): every sprite of a person uses the same frame, so their sprites share one scale
const FRAMES = {
  patient: { x: [58, 142], y: [6, 204], z: [0, 34] },
  A: { x: [8, 128], y: [104, 200], z: [0, 128] },
};
const SPRITES = {
  P1: { frame: 'patient', people: [['patient', {}]], opt: { shirtOpen: 0 } },
  P2: { frame: 'patient', people: [['patient', { tilt: 1 }]], opt: { shirtOpen: 0 } },
  P3: { frame: 'patient', people: [['patient', {}]], opt: { shirtOpen: 1 } },
};
const id = new URLSearchParams(location.search).get('sprite') || 'P1', SP = SPRITES[id], F = FRAMES[SP.frame];
const corners = [];
for (const x of F.x) for (const y of F.y) for (const z of F.z) corners.push([x, y, z]);
RC = [F.x[0], F.y[0]]; OX = OY = 0;
const q = corners.map(c => P(...c)), xs = q.map(v => v[0]), ys = q.map(v => v[1]);
// pad the frame to exactly 3:2 (the image model's aspect), centred, so a generated image maps back by scale alone
let x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
if (w / h < 1.5) { const W2 = h * 1.5; x0 -= (W2 - w) / 2; w = W2; } else { const H2 = w / 1.5; y0 -= (H2 - h) / 2; h = H2; }
OX = -x0; OY = -y0;
const parts = SP.people.flatMap(([who, o]) => pplPerson(PP.solve(PP.POSES[who === 'patient' ? 'patient' : who](o)), SP.opt));
const PX_PER_UNIT = 1536 / w;
document.getElementById('out').innerHTML = `<svg width="${(w * PX_PER_UNIT / 2).toFixed(0)}" height="${(h * PX_PER_UNIT / 2).toFixed(0)}" viewBox="0 0 ${w.toFixed(2)} ${h.toFixed(2)}">${byDepth(parts)}</svg>`;
// where this frame sits in the scene projection (P with OX = OY = 0, RC as above): add these to place the sprite
window.SPRITE_META = { sprite: id, frame: SP.frame, originX: x0, originY: y0, width: w, height: h };
document.title = JSON.stringify(window.SPRITE_META);
</script>
</body>
</html>
